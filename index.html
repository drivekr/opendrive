<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OpenDrive Korea — 한국에서 합법적인 자율주행을 최대한 빠르게</title>
<meta name="description" content="국제기준이 한국 도로에 닿기까지, 막힌 지점을 근거로 추적합니다." />
<meta property="og:title" content="OpenDrive Korea" />
<meta property="og:description" content="국제기준이 한국 도로에 닿기까지, 막힌 지점을 근거로 추적합니다." />
<meta property="og:type" content="website" />
<style>
  :root {
    --bg: #FAFAFA; --surface: #FFFFFF; --text: #111111; --muted: #606975;
    --border: #E3E6EB; --accent: #1D4ED8; --accent-soft: #EFF6FF;
    --max: 1040px;
    --font: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); line-height: 1.6; letter-spacing: -.02em; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-underline-offset: 3px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: default; opacity: .55; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
  [hidden] { display: none !important; }
  .wrap { max-width: var(--max); margin: 0 auto; padding: 0 28px; }
  header { border-bottom: 1px solid var(--border); }
  .nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; }
  .brand { font-weight: 800; font-size: 13px; letter-spacing: .08em; text-decoration: none; }
  .participate { font-size: 13px; font-weight: 600; color: var(--muted); text-decoration: none; }
  .participate:hover, footer a:hover { color: var(--accent); }
  .mission { padding-top: 44px; padding-bottom: 36px; }
  .eyebrow { margin: 0 0 12px; font-size: 11px; letter-spacing: .14em; font-weight: 700; color: var(--muted); }
  h1 { margin: 0; font-size: clamp(30px, 4.3vw, 48px); font-weight: 800; line-height: 1.23; letter-spacing: -.04em; }
  .mission p:last-child { margin: 18px 0 0; color: var(--muted); font-size: 16px; text-wrap: balance; }
  .timeline { padding: 28px 0 48px; border-top: 1px solid var(--border); }
  .topic { display: flex; align-items: baseline; gap: 14px; margin-bottom: 16px; }
  .topic .eyebrow { margin: 0; }
  h2 { margin: 0; font-size: 24px; line-height: 1.3; letter-spacing: -.025em; }
  .current-state { padding: 16px 18px; border: 1px solid #DBE6FA; background: var(--accent-soft); border-radius: 12px; }
  .current-heading { margin: 0 0 10px; font-size: 12px; font-weight: 700; color: var(--accent); }
  .outcomes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .outcome { display: flex; align-items: center; justify-content: space-between; gap: 14px; width: 100%; background: transparent; border: 0; padding: 0; text-align: left; font-size: 14px; font-weight: 600; }
  .outcome .result { flex-shrink: 0; font-size: 12px; font-weight: 500; color: var(--accent); }
  .outcome:hover .outcome-name { text-decoration: underline; text-underline-offset: 3px; }
  .measurement { margin: 10px 0 0; color: var(--muted); font-size: 12px; }
  .measurement details { display: inline; }
  .measurement summary { display: inline; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .measurement details p { margin: 6px 0 0; max-width: 74ch; }
  .measurement a { color: var(--accent); }
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 24px 0 14px; }
  .view-title { margin: 0; font-size: 15px; font-weight: 700; }
  .controls { display: flex; gap: 8px; }
  .control { padding: 7px 12px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); font-size: 13px; font-weight: 600; }
  .control:hover { border-color: var(--accent); }
  .control[aria-pressed="true"] { color: var(--accent); border-color: #B7CCFA; background: var(--accent-soft); }
  .view-note { margin: 0 0 18px; font-size: 12px; color: var(--muted); }
  .event-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; }
  .event-list > li { position: relative; padding-left: 22px; }
  .event-list > li::before { content: ""; position: absolute; left: 4px; top: 28px; width: 7px; height: 7px; background: #9AA1AC; border-radius: 50%; }
  .event-list > li::after { content: ""; position: absolute; left: 7px; width: 1px; top: 43px; bottom: -14px; background: var(--border); }
  .event-list > li:last-child::after { display: none; }
  .event-card { display: block; width: 100%; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; text-align: left; }
  .event-card:hover { border-color: #A9BDEB; }
  .event-card[aria-expanded="true"], .outcome[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
  .event-card[aria-expanded="true"] { background: var(--accent-soft); }
  .event-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 5px; }
  .event-date { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); }
  .event-arrow { color: #87909D; font-size: 16px; }
  .event-title { display: block; font-size: 17px; font-weight: 700; line-height: 1.4; }
  .event-meta { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 8px; font-size: 12px; font-weight: 400; color: var(--muted); line-height: 1.5; }
  .verification { display: inline-flex; align-items: baseline; gap: 5px; }
  .more { display: block; margin: 16px auto 0; background: transparent; border: 0; padding: 8px 14px; color: var(--accent); font-size: 13px; font-weight: 600; }
  #earlier-records { margin-top: 12px; }
  .undated { margin-top: 28px; padding-top: 22px; border-top: 1px solid var(--border); }
  .undated h3 { margin: 0 0 6px; font-size: 14px; }
  .undated .event-list > li { padding-left: 0; }
  .undated .event-list > li::before, .undated .event-list > li::after { display: none; }
  .undated .event-card { background: transparent; }
  .period { padding: 18px 0; border-top: 1px solid var(--border); }
  .period:first-child { padding-top: 0; border-top: 0; }
  .period-title { margin: 0 0 12px; font-size: 14px; font-variant-numeric: tabular-nums; }
  .comparison-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .country { min-width: 0; }
  .country h4 { margin: 0 0 8px; color: var(--muted); font-size: 11px; font-weight: 600; }
  .country.kr h4 { color: var(--accent); }
  .country .event-card + .event-card { margin-top: 10px; }
  .country .event-card { padding: 12px 14px; }
  .country .event-title { font-size: 15px; }
  .country .event-meta { display: grid; gap: 5px; }
  .empty-records { margin: 0; color: #7A828E; font-size: 12px; }
  .load-message { padding: 20px; border: 1px solid var(--border); background: var(--surface); border-radius: 10px; font-size: 14px; }
  .load-message p { margin: 0 0 12px; }
  .load-message a { color: var(--accent); }
  footer { padding: 24px 0 32px; border-top: 1px solid var(--border); }
  .foot { display: flex; gap: 24px; font-size: 12px; color: var(--muted); }
  footer a { text-decoration: none; }
  body.panel-open { overflow: hidden; }
  .drawer-back { position: fixed; inset: 0; background: rgba(17, 24, 39, .22); z-index: 40; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--surface); z-index: 41; box-shadow: -8px 0 32px rgba(0,0,0,.08); display: flex; flex-direction: column; }
  .drawer-header { display: flex; gap: 16px; justify-content: space-between; align-items: flex-start; padding: 24px; border-bottom: 1px solid var(--border); }
  .drawer-kicker { margin: 0 0 6px; font-size: 11px; letter-spacing: .1em; color: var(--muted); }
  .drawer h2 { font-size: 22px; line-height: 1.4; }
  .drawer-close { flex-shrink: 0; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); font-size: 12px; }
  .drawer-content { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 24px 24px 40px; overflow-wrap: anywhere; }
  .drawer-content p, .drawer-content li { font-size: 14px; }
  .drawer-content p { margin: 0 0 14px; }
  .drawer-content a { color: var(--accent); }
  .drawer-content h3 { margin: 24px 0 10px; font-size: 16px; }
  .drawer-content h4 { margin: 20px 0 8px; font-size: 14px; }
  .drawer-content ul { padding-left: 20px; }
  .drawer-content dl { margin: 20px 0; display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 10px 14px; font-size: 13px; }
  .drawer-content dt { color: var(--muted); }
  .drawer-content dd { margin: 0; }
  .source-list { margin: 0; padding: 0 !important; list-style: none; }
  .source-list li { padding: 8px 0; }
  .source-list small { display: block; margin-top: 3px; font-size: 12px; color: var(--muted); }
  .disclosure { border-top: 1px solid var(--border); margin-top: 20px; padding-top: 16px; }
  .disclosure > summary { cursor: pointer; font-weight: 700; font-size: 14px; }
  .disclosure > summary:focus-visible { outline-offset: 2px; }
  .scope-note { margin: 14px 0 !important; padding: 12px; background: var(--accent-soft); color: #4E5C72; font-size: 12px !important; }
  .register { padding: 14px 0; border-bottom: 1px solid var(--border); }
  .register strong { font-size: 14px; }
  .register p { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
  .field-label { font-weight: 600; }
  .stats { display: grid; gap: 12px; margin-top: 14px; }
  .stat { padding: 14px; border: 1px solid var(--border); border-radius: 8px; }
  .stat strong { font-size: 22px; }
  .stat span { display: block; margin-top: 5px; font-size: 12px; color: var(--muted); }
  .action-list { list-style: none; padding: 0 !important; }
  .action-list > li { display: flex; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .action-list small { display: block; margin-top: 6px; color: var(--muted); }
  @media (max-width: 680px) {
    .wrap { padding-left: 20px; padding-right: 20px; }
    .nav { min-height: 56px; }
    .brand { font-size: 11px; }
    .participate { font-size: 12px; }
    .mission { padding-top: 28px; padding-bottom: 26px; }
    .mission .eyebrow { margin-bottom: 9px; }
    .mission p:last-child { font-size: 14px; margin-top: 14px; max-width: 36ch; }
    .timeline { padding-top: 22px; }
    .topic { gap: 10px; margin-bottom: 14px; }
    h2 { font-size: 20px; }
    .current-state { padding: 12px 14px; }
    .current-heading { margin-bottom: 8px; font-size: 11px; }
    .outcomes { grid-template-columns: 1fr; gap: 10px; }
    .outcome { font-size: 13px; gap: 12px; }
    .outcome .result { font-size: 11px; }
    .toolbar { align-items: flex-start; flex-wrap: wrap; margin-top: 20px; gap: 10px; }
    .view-title { flex: 1 0 100%; font-size: 14px; }
    .control { padding: 7px 10px; font-size: 12px; }
    .view-note { font-size: 11px; margin-bottom: 14px; }
    .event-list > li { padding-left: 18px; }
    .event-card { padding: 14px 15px; }
    .event-title { font-size: 16px; }
    .event-meta { display: grid; gap: 5px; font-size: 11px; }
    .comparison-grid { grid-template-columns: 1fr; gap: 14px; }
    .country.empty { display: none; }
    .country h4 { font-size: 12px; }
    .drawer { top: auto; left: 0; bottom: 0; width: 100%; max-height: 82vh; max-height: 82dvh; border-radius: 16px 16px 0 0; }
    .drawer-header { padding: 18px 20px; }
    .drawer h2 { font-size: 20px; }
    .drawer-content { padding: 20px 20px max(28px, env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<div id="page-content">
  <header>
    <nav class="wrap nav" aria-label="상단 탐색">
      <a class="brand" href="#top">OPENDRIVE KOREA</a>
      <a class="participate" href="https://github.com/drivekr/opendrive/issues">조사에 참여하기 ↗</a>
    </nav>
  </header>
  <main id="top">
    <section class="wrap mission" aria-labelledby="mission-title">
      <p class="eyebrow">MISSION</p>
      <h1 id="mission-title">한국에서 합법적인 자율주행을<br />최대한 빠르게.</h1>
      <p>국제기준이 한국 도로에 닿기까지, 막힌 지점을 근거로 추적합니다.</p>
    </section>
    <section class="timeline" aria-labelledby="timeline-title">
      <div class="wrap">
        <div class="topic">
          <p class="eyebrow">조사 타임라인</p>
          <h2 id="timeline-title">DCAS / Tesla FSD</h2>
        </div>
        <div id="current-state" aria-live="polite"><p class="view-note">조사 기록을 읽는 중…</p></div>
        <div id="measurement-view" class="measurement"></div>
        <div class="toolbar">
          <h3 id="view-title" class="view-title">한국의 기록</h3>
          <div class="controls">
            <button id="compare-toggle" class="control" aria-pressed="false" aria-controls="tl-inner" disabled>국제·일본 비교</button>
            <button id="study-open" class="control" aria-haspopup="dialog" aria-controls="drawer" aria-expanded="false" disabled>조사 정리 ↗</button>
          </div>
        </div>
        <p id="view-note" class="view-note">최신순 · 사건을 선택하면 근거와 관련 주체를 볼 수 있습니다.</p>
        <div id="tl-inner" aria-busy="true"></div>
        <noscript><p class="load-message">타임라인을 보려면 JavaScript가 필요합니다. <a href="https://github.com/drivekr/opendrive/blob/main/wiki/dcas.md">위키 정리</a>에서 기록과 raw 근거를 읽을 수 있습니다.</p></noscript>
      </div>
    </section>
  </main>
  <footer>
    <div class="wrap foot">
      <a href="https://github.com/drivekr/opendrive">GitHub</a>
      <a href="https://github.com/drivekr/opendrive/blob/main/README.md">프로젝트 소개</a>
      <a href="mailto:drivekr@proton.me">연락처</a>
    </div>
  </footer>
</div>
<div id="drawer-back" class="drawer-back" hidden></div>
<aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title" tabindex="-1" hidden>
  <div class="drawer-header">
    <div><p id="d-kicker" class="drawer-kicker">사건 상세</p><h2 id="d-title"></h2></div>
    <button id="drawer-close" class="drawer-close" aria-label="패널 닫기">닫기 ✕</button>
  </div>
  <div id="d-content" class="drawer-content"></div>
</aside>
<script src="assets/wiki-view.js"></script>
</body>
</html>
